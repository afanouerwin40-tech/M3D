<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M3D Gestion</title>
<meta name="description" content="Gestion des membres, cotisations et anniversaires — Jeunesse M3D">
<meta name="theme-color" content="#F5F4F1" id="meta-theme-color">
<link rel="manifest" href="./manifest.webmanifest">
<!-- Les anciennes versions d'iOS (12/13/14) lisent mal le manifest.webmanifest
     pour le mode "ecran d'accueil" : ces balises apple-* assurent que
     l'app s'ouvre en plein ecran (sans barre Safari) meme sur un vieil iPad. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="M3D Gestion">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar" role="banner">
    <div class="brand">
      <h1>Jeunesse M3D</h1>
    </div>
    <span class="session-chip" aria-label="Session pastorale en cours">Session 2026-2027</span>
  </header>

  <main id="app-content" role="main" tabindex="-1"></main>

  <nav class="tabbar" role="navigation" aria-label="Navigation principale">
    <button class="tab active" data-tab="accueil" role="tab" aria-selected="true" aria-label="Accueil">
      <span class="tab-bump" aria-hidden="true"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
      <span class="tab-label">Accueil</span>
    </button>
    <button class="tab" data-tab="membres" role="tab" aria-selected="false" aria-label="Membres">
      <span class="tab-bump" aria-hidden="true"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 3.128a4 4 0 0 1 0 7.744"/><path stroke-linecap="round" stroke-linejoin="round" d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></span>
      <span class="tab-label">Membres</span>
    </button>
    <button class="tab" data-tab="dimanche" role="tab" aria-selected="false" aria-label="Dimanche et cotisations">
      <span class="tab-bump" aria-hidden="true"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 2v3"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 9h18"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 13h.01"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 13h.01"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 13h.01"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 17h.01"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 17h.01"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 17h.01"/></svg></span>
      <span class="tab-label">Dimanche</span>
    </button>
    <button class="tab" data-tab="dettes" role="tab" aria-selected="false" aria-label="Dettes et relances">
      <span class="tab-bump" aria-hidden="true"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>
      <span class="tab-label">Dettes</span>
    </button>
    <button class="tab" data-tab="plus" role="tab" aria-selected="false" aria-label="Plus d'options et modules">
      <span class="tab-bump" aria-hidden="true"><svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 12h16"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 19h16"/></svg></span>
      <span class="tab-label">Plus</span>
    </button>
  </nav>
</div>
<div id="toast-host" aria-live="polite" aria-atomic="true"></div>

<!-- Bibliothèques externes -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.4/dexie.min.js"></script>

<!-- Architecture modulaire M3D (ordre strict de dépendance) -->
<script src="./js/config.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/db.js"></script>
<script src="./js/state.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
